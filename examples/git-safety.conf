# .git-safety.conf — settings for git-safety-hooks. git-config syntax; commit it with your repo.
# Every key can also be set per machine with `git config safety.<section>.<key> <value>`,
# which wins over this file. Multi-value keys: repeat the line (values from both places add up).
#
# This file must be valid git-config, or the hooks stop with an error. In a regex, double every
# backslash: \\b and \\d. (git-config reads \b as a backspace and rejects \d.)

[secretScan]
	enabled = true
	# Local, uncommitted env files whose VALUES must never appear in a commit (hashed, never printed).
	envFile = .env
	# envFile = backend/.env
	# Extra patterns (JavaScript regex source), reported as "custom pattern".
	# pattern = \\bmycorp_live_[A-Za-z0-9]{32}\\b
	# Paths never scanned (JavaScript regex source). Skipped files are counted in the output.
	# ignorePath = ^test/fixtures/
	# Paths that may be committed although their NAME looks like a secrets file (.envrc, *.key …).
	# Their contents are still scanned.
	# allowName = (^|/)\\.envrc$

[staleRevert]
	enabled = true
	# windowHours = 48           # how far back "recent" commits go
	# ratio = 0.9                # share of a commit's lines that must be inverted
	# minLines = 5               # a commit must have added at least this many lines in a file
	# smallWindowMinutes = 30    # smaller commits count only if this recent
	# skipPath = ^generated/

